<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
<rect width="1000" height="330" fill="#142019"/>
<rect x="114" y="100" width="646" height="80" fill="#1e3f20" stroke="#38a169" stroke-width="2"/>
<text x="438" y="146" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">analog passband</text>
<text x="438" y="167" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">flat to 0.5 Hz (measured) up to the low-pass corner</text>
<line x1="114" y1="60" x2="114" y2="100" stroke="#38a169" stroke-dasharray="4 3"/>
<text x="120" y="52" fill="#e2e8f0" font-size="13" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">HPF 0.16 Hz (design)</text>
<line x1="761" y1="60" x2="761" y2="100" stroke="#38a169" stroke-dasharray="4 3"/>
<text x="755" y="52" text-anchor="end" fill="#e2e8f0" font-size="13" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">LPF -3 dB 42.5 Hz (measured)</text>
<line x1="801" y1="76" x2="801" y2="200" stroke="#e2e8f0" stroke-width="2"/>
<text x="809" y="82" fill="#e2e8f0" font-size="13" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">60 Hz mains</text>
<line x1="888" y1="100" x2="888" y2="200" stroke="#d4a843" stroke-dasharray="5 4"/>
<text x="894" y="118" fill="#d4a843" font-size="12" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">Nyquist</text>
<text x="894" y="134" fill="#d4a843" font-size="12" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">128 Hz</text>
<line x1="60" y1="200" x2="940" y2="200" stroke="#38a169" stroke-width="2"/>
<line x1="60" y1="194" x2="60" y2="206" stroke="#38a169" stroke-width="2"/><text x="60" y="228" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">0.1 Hz</text>
<line x1="327" y1="194" x2="327" y2="206" stroke="#38a169" stroke-width="2"/><text x="327" y="228" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">1 Hz</text>
<line x1="593" y1="194" x2="593" y2="206" stroke="#38a169" stroke-width="2"/><text x="593" y="228" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">10 Hz</text>
<line x1="860" y1="194" x2="860" y2="206" stroke="#38a169" stroke-width="2"/><text x="860" y="228" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">100 Hz</text>
<line x1="801" y1="206" x2="801" y2="250" stroke="#94a3b8"/>
<text x="801" y="268" text-anchor="end" fill="#e2e8f0" font-size="13" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">firmware 60 Hz notch (after the ADC, Q = 30)</text>
<text x="500" y="312" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace">frequency, log scale. Sampling is 256 Hz; the analog filter takes 6.9 dB off 60 Hz and the notch removes the rest.</text>
